<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1160" viewBox="0 0 1420 1160" role="img" aria-labelledby="title desc">
<title id="title">DESCARTADO: contorno entero con aguas hacia delante y atrás</title>
<desc id="desc">Croquis geométrico propuesto: una sola pieza continua, con el techo en el centro y los dos laterales enteros. No hay cortes interiores ni uniones en mitad de los laterales. Lona hecha 245 por 144 centímetros, extremos a 80 y centro a 96. Techo desarrollado 247,08. Cada borde inferior lateral mide 245, dividido solo a efectos de medición en dos tramos de 122,5. Esta propuesta conserva las cotas principales pero necesita adaptación diagonal de la lona: no es un desarrollo isométrico validado ni incluye demasías de confección.</desc>
